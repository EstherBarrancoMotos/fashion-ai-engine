[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-ai-engine"
version = "0.1.0"
description = "Deployable fashion image ML API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pillow==11.1.0",
  "numpy==2.2.2",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "pyyaml==6.0.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
